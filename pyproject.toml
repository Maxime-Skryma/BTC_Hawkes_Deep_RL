[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hawkes-deep-rl"
version = "0.3.0"
description = "Reproducible CJR Hawkes market-making benchmark: deep RL versus non-neural controls"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "numba>=0.58",
  "pyarrow>=12", "torch>=2.1", "matplotlib>=3.7", "Pillow>=9", "PyYAML>=6", "pytest>=8"
]

[project.optional-dependencies]
notebook = ["ipykernel>=6", "nbformat>=5.9", "nbclient>=0.9", "ipywidgets>=8"]

[project.scripts]
hawkes-rl = "cjr.workflow:main"

[tool.setuptools.packages.find]
include = ["cjr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

